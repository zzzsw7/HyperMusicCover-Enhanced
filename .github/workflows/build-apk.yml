name: Build APK (Enhanced)

# HyperMusicCover-Enhanced 的 CI 构建。
# 这个仓库带 `hyper-canvas` 子模块（settings.gradle.kts 里 include 了它），
# 但 `git submodule update` 在某些环境会崩，所以这里**手动浅克隆**到该目录。
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch hyper-canvas
        run: |
          rmdir hyper-canvas 2>/dev/null || true
          git clone --depth 1 https://github.com/Lewewe/HyperCanvas.git hyper-canvas
          ls hyper-canvas | head

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-hmce-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-hmce-${{ runner.os }}-

      - name: Build release
        env:
          SIGNING_STORE_FILE: ci/debug.keystore
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_ALIAS: androiddebugkey
          SIGNING_KEY_PASSWORD: android
          MC_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PmcVersionCode=$((900000 + MC_CODE)) \
            -PmcVersionName="en.$MC_CODE"

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: HyperMusicCoverEnhanced-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30